[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch"
version = "0.1.0"
description = "Local-first defensive host security auditing dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Driftwatch Contributors" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "psutil>=5.9,<8.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.32,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0"
]

[project.scripts]
driftwatch = "driftwatch.app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"driftwatch.app" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
